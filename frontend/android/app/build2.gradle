android {
    // 1. Explicitly define the namespace (Required for AGP 8.0+)
    namespace "com.sudhanshunaik.amrit"

    compileSdk 34 // Updated to 34 for better compatibility

    defaultConfig {
        // 2. Ensure this matches your namespace
        applicationId "com.sudhanshunaik.amrit"

        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-txt'), 'proguard-rules.pro'
        }
    }

    // 3. Force Java 17 (Required for AGP 8.0)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}